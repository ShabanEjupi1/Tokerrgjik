[build]
  # Only install function dependencies - Flutter web build done locally
  command = "npm install --prefix netlify/functions"
  publish = "build/web"
  functions = "netlify/functions"
  # Base directory is the root, not tokerrgjik_mobile
  base = ""

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# API redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Allow direct access to verification files
[[redirects]]
  from = "/BingSiteAuth.xml"
  to = "/BingSiteAuth.xml"
  status = 200
  force = true

[[redirects]]
  from = "/google9d4f44d9d273f067.html"
  to = "/google9d4f44d9d273f067.html"
  status = 200
  force = true

# SPA fallback - exclude function paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[functions]
  node_bundler = "esbuild"

[context.production]
  command = "npm install --prefix netlify/functions"

[context.deploy-preview]
  command = "npm install --prefix netlify/functions"

[context.branch-deploy]
  command = "npm install --prefix netlify/functions"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# DO NOT cache index.html - always fetch fresh version
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# DO NOT cache service worker - must check for updates
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# DO NOT cache main Flutter JS - it changes with each build
[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# DO NOT cache Flutter bootstrap
[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# DO NOT cache Flutter.js
[[headers]]
  for = "/flutter.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache static assets with hashes for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CanvasKit files (versioned by Flutter)
[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache icons
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
