name: Build Android & iOS Apps

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase timeout for build process
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Setup Android SDK
        run: |
          echo "📦 Setting up Android SDK..."
          # Flutter action already includes Android SDK
          echo "✅ Android SDK available via Flutter"
        
      - name: Generate API keys
        working-directory: tokerrgjik_mobile
        run: |
          # Copy template file to actual config
          if [ -f lib/config/api_keys.dart.template ]; then
            cp lib/config/api_keys.dart.template lib/config/api_keys.dart
            echo "✅ API keys generated from template"
          else
            echo "⚠️  No template found, creating empty config"
            cat > lib/config/api_keys.dart <<EOF
          class ApiKeys {
            static const String admobAppIdAndroid = '';
            static const String admobAppIdIos = '';
            static const String admobBannerAndroid = '';
            static const String admobBannerIos = '';
            static const String admobInterstitialAndroid = '';
            static const String admobInterstitialIos = '';
            static const String admobRewardedAndroid = '';
            static const String admobRewardedIos = '';
          }
          EOF
          fi
      
      - name: Get dependencies
        working-directory: tokerrgjik_mobile
        run: flutter pub get
      
      - name: Configure Gradle for CI
        working-directory: tokerrgjik_mobile/android
        run: |
          # Create gradle.properties with CI-optimized settings
          cat >> gradle.properties <<EOF
          
          # CI-specific optimizations
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          
          echo "✅ Gradle configuration updated for CI"
          cat gradle.properties
      
      - name: Display build environment
        working-directory: tokerrgjik_mobile
        run: |
          echo "📊 Build Environment Information:"
          echo "Flutter Version: $(flutter --version)"
          echo "Java Version: $(java -version 2>&1 | head -n 1)"
          echo "Available Memory: $(free -h | grep Mem)"
          cd android && ./gradlew --version
      
      - name: Analyze Dart code
        working-directory: tokerrgjik_mobile
        run: flutter analyze --no-fatal-infos || true
      
      - name: Build APK (Release)
        working-directory: tokerrgjik_mobile
        timeout-minutes: 45
        run: |
          echo "🏗️ Starting APK build..."
          
          # Set default values if secrets are not configured
          CRYPTOLENS_PRODUCT_ID="${{ secrets.CRYPTOLENS_PRODUCT_ID }}"
          CRYPTOLENS_ACCESS_TOKEN="${{ secrets.CRYPTOLENS_ACCESS_TOKEN }}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${{ secrets.CRYPTOLENS_RSA_PUBLIC_KEY }}"
          
          # Use empty strings if secrets are not set
          CRYPTOLENS_PRODUCT_ID="${CRYPTOLENS_PRODUCT_ID:-}"
          CRYPTOLENS_ACCESS_TOKEN="${CRYPTOLENS_ACCESS_TOKEN:-}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${CRYPTOLENS_RSA_PUBLIC_KEY:-}"
          
          echo "📦 Building APK with configuration:"
          echo "  - Split per ABI: enabled"
          echo "  - Release mode: enabled"
          echo "  - Verbose output: enabled"
          
          # Build with error handling
          flutter build apk --release --split-per-abi \
            --dart-define=CRYPTOLENS_PRODUCT_ID="$CRYPTOLENS_PRODUCT_ID" \
            --dart-define=CRYPTOLENS_ACCESS_TOKEN="$CRYPTOLENS_ACCESS_TOKEN" \
            --dart-define=CRYPTOLENS_RSA_PUBLIC_KEY="$CRYPTOLENS_RSA_PUBLIC_KEY" 2>&1 | tee build.log || {
              echo "❌ APK build failed!"
              echo "📋 Last 100 lines of build log:"
              tail -n 100 build.log
              echo "🔍 Checking Gradle daemon logs..."
              find android/.gradle -name "*.log" -exec tail -n 20 {} \;
              echo "🩺 Running flutter doctor..."
              flutter doctor -v
              exit 1
            }
          
          echo "✅ APK build completed successfully!"
          echo "📦 Listing generated APKs:"
          ls -lh build/app/outputs/flutter-apk/
      
      - name: Build App Bundle (Release)
        working-directory: tokerrgjik_mobile
        timeout-minutes: 30
        run: |
          echo "🏗️ Starting App Bundle build..."
          
          # Set default values if secrets are not configured
          CRYPTOLENS_PRODUCT_ID="${{ secrets.CRYPTOLENS_PRODUCT_ID }}"
          CRYPTOLENS_ACCESS_TOKEN="${{ secrets.CRYPTOLENS_ACCESS_TOKEN }}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${{ secrets.CRYPTOLENS_RSA_PUBLIC_KEY }}"
          
          # Use empty strings if secrets are not set
          CRYPTOLENS_PRODUCT_ID="${CRYPTOLENS_PRODUCT_ID:-}"
          CRYPTOLENS_ACCESS_TOKEN="${CRYPTOLENS_ACCESS_TOKEN:-}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${CRYPTOLENS_RSA_PUBLIC_KEY:-}"
          
          echo "📦 Building App Bundle with configuration:"
          echo "  - Release mode: enabled"
          
          flutter build appbundle --release \
            --verbose \
            --dart-define=CRYPTOLENS_PRODUCT_ID="$CRYPTOLENS_PRODUCT_ID" \
            --dart-define=CRYPTOLENS_ACCESS_TOKEN="$CRYPTOLENS_ACCESS_TOKEN" \
            --dart-define=CRYPTOLENS_RSA_PUBLIC_KEY="$CRYPTOLENS_RSA_PUBLIC_KEY" || {
              echo "❌ App Bundle build failed!"
              echo "Checking for common issues..."
              flutter doctor -v
              exit 1
            }
          
          echo "✅ App Bundle build completed successfully!"
          echo "📦 Listing generated AAB:"
          ls -lh build/app/outputs/bundle/release/
      
      - name: Verify build outputs
        working-directory: tokerrgjik_mobile
        run: |
          echo "🔍 Verifying build outputs..."
          
          # Check APK files
          if [ -d "build/app/outputs/flutter-apk" ]; then
            echo "✅ APK directory exists"
            APK_COUNT=$(find build/app/outputs/flutter-apk -name "*.apk" | wc -l)
            echo "📦 Found $APK_COUNT APK file(s):"
            find build/app/outputs/flutter-apk -name "*.apk" -exec ls -lh {} \;
          else
            echo "❌ APK directory not found!"
          fi
          
          # Check AAB files
          if [ -d "build/app/outputs/bundle/release" ]; then
            echo "✅ AAB directory exists"
            AAB_COUNT=$(find build/app/outputs/bundle/release -name "*.aab" | wc -l)
            echo "📦 Found $AAB_COUNT AAB file(s):"
            find build/app/outputs/bundle/release -name "*.aab" -exec ls -lh {} \;
          else
            echo "❌ AAB directory not found!"
          fi
      
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            tokerrgjik_mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
      
      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            tokerrgjik_mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 7
      
      - name: Build Summary
        if: always()
        working-directory: tokerrgjik_mobile
        run: |
          echo "📊 Build Summary"
          echo "================================"
          echo ""
          echo "Flutter Version:"
          flutter --version
          echo ""
          echo "Build Status:"
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            echo "✅ APK build: SUCCESS"
          else
            echo "❌ APK build: FAILED"
          fi
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ AAB build: SUCCESS"
          else
            echo "❌ AAB build: FAILED"
          fi
          echo ""
          echo "Disk usage:"
          df -h .

      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tokerrgjik_mobile/build/app/outputs/flutter-apk/*.apk
            tokerrgjik_mobile/build/app/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14  # macOS with Apple Silicon
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Generate API keys
        working-directory: tokerrgjik_mobile
        run: |
          # Copy template file to actual config
          if [ -f lib/config/api_keys.dart.template ]; then
            cp lib/config/api_keys.dart.template lib/config/api_keys.dart
            echo "✅ API keys generated from template"
          else
            echo "⚠️  No template found, creating empty config"
            cat > lib/config/api_keys.dart <<EOF
          class ApiKeys {
            static const String admobAppIdAndroid = '';
            static const String admobAppIdIos = '';
            static const String admobBannerAndroid = '';
            static const String admobBannerIos = '';
            static const String admobInterstitialAndroid = '';
            static const String admobInterstitialIos = '';
            static const String admobRewardedAndroid = '';
            static const String admobRewardedIos = '';
          }
          EOF
          fi
      
      - name: Get dependencies
        working-directory: tokerrgjik_mobile
        run: flutter pub get
      
      - name: Build iOS (No Codesign)
        working-directory: tokerrgjik_mobile
        run: |
          echo "ℹ️  Building iOS without codesigning (manual signing required for deployment)"
          
          # Set default values if secrets are not configured
          CRYPTOLENS_PRODUCT_ID="${{ secrets.CRYPTOLENS_PRODUCT_ID }}"
          CRYPTOLENS_ACCESS_TOKEN="${{ secrets.CRYPTOLENS_ACCESS_TOKEN }}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${{ secrets.CRYPTOLENS_RSA_PUBLIC_KEY }}"
          
          # Use empty strings if secrets are not set
          CRYPTOLENS_PRODUCT_ID="${CRYPTOLENS_PRODUCT_ID:-}"
          CRYPTOLENS_ACCESS_TOKEN="${CRYPTOLENS_ACCESS_TOKEN:-}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${CRYPTOLENS_RSA_PUBLIC_KEY:-}"
          
          flutter build ios --release --no-codesign \
            --dart-define=CRYPTOLENS_PRODUCT_ID="$CRYPTOLENS_PRODUCT_ID" \
            --dart-define=CRYPTOLENS_ACCESS_TOKEN="$CRYPTOLENS_ACCESS_TOKEN" \
            --dart-define=CRYPTOLENS_RSA_PUBLIC_KEY="$CRYPTOLENS_RSA_PUBLIC_KEY" || {
              echo "❌ iOS build failed!"
              flutter doctor -v
              exit 1
            }
          
          echo "✅ iOS build complete - manual codesigning needed before App Store submission"
      
      - name: Create IPA
        working-directory: tokerrgjik_mobile
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/Tokerrgjik.ipa Payload/
          rm -rf Payload
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: tokerrgjik_mobile/build/ios/ipa/*.ipa
          retention-days: 7
      
      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: tokerrgjik_mobile/build/ios/ipa/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      
      - name: Generate API keys
        working-directory: tokerrgjik_mobile
        run: |
          # Copy template file to actual config
          if [ -f lib/config/api_keys.dart.template ]; then
            cp lib/config/api_keys.dart.template lib/config/api_keys.dart
            echo "✅ API keys generated from template"
          else
            echo "⚠️  No template found, creating empty config"
            cat > lib/config/api_keys.dart <<EOF
          class ApiKeys {
            static const String admobAppIdAndroid = '';
            static const String admobAppIdIos = '';
            static const String admobBannerAndroid = '';
            static const String admobBannerIos = '';
            static const String admobInterstitialAndroid = '';
            static const String admobInterstitialIos = '';
            static const String admobRewardedAndroid = '';
            static const String admobRewardedIos = '';
          }
          EOF
          fi
      
      - name: Get dependencies
        working-directory: tokerrgjik_mobile
        run: flutter pub get
      
      - name: Build Web
        working-directory: tokerrgjik_mobile
        run: |
          echo "🌐 Building web version..."
          
          # Set default values if secrets are not configured
          CRYPTOLENS_PRODUCT_ID="${{ secrets.CRYPTOLENS_PRODUCT_ID }}"
          CRYPTOLENS_ACCESS_TOKEN="${{ secrets.CRYPTOLENS_ACCESS_TOKEN }}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${{ secrets.CRYPTOLENS_RSA_PUBLIC_KEY }}"
          
          # Use empty strings if secrets are not set
          CRYPTOLENS_PRODUCT_ID="${CRYPTOLENS_PRODUCT_ID:-}"
          CRYPTOLENS_ACCESS_TOKEN="${CRYPTOLENS_ACCESS_TOKEN:-}"
          CRYPTOLENS_RSA_PUBLIC_KEY="${CRYPTOLENS_RSA_PUBLIC_KEY:-}"
          
          flutter build web --release \
            --dart-define=CRYPTOLENS_PRODUCT_ID="$CRYPTOLENS_PRODUCT_ID" \
            --dart-define=CRYPTOLENS_ACCESS_TOKEN="$CRYPTOLENS_ACCESS_TOKEN" \
            --dart-define=CRYPTOLENS_RSA_PUBLIC_KEY="$CRYPTOLENS_RSA_PUBLIC_KEY" || {
              echo "❌ Web build failed!"
              flutter doctor -v
              exit 1
            }
          
          echo "✅ Web build completed successfully!"
      
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './tokerrgjik_mobile/build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
      
      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: tokerrgjik_mobile/build/web/
          retention-days: 7
