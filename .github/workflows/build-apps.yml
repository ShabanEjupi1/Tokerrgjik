name: Ndërto dhe testo

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  # ── Testet vijnë të parat dhe gjithçka tjetër varet prej tyre ──────────────
  #
  # Motori dhe serveri janë Dart i pastër: testohen pa Flutter, pa emulator dhe
  # pa telefon, në pak sekonda. Kjo është arsyeja pse rregullat u nxorën jashtë
  # aplikacionit — një lojë tabele mund të jetë e gabuar në mënyra që asnjë
  # ndërtim i suksesshëm nuk i tregon.
  test:
    name: Testet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Motori — analiza dhe testet
        working-directory: engine
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - name: Serveri — analiza dhe testet
        working-directory: server
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Aplikacioni — analiza dhe testet
        working-directory: tokerrgjik_mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # ── Android ───────────────────────────────────────────────────────────────
  android:
    name: Android (AAB + APK)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Vendos çelësin e nënshkrimit
        working-directory: tokerrgjik_mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Pa këtë skedar, `build.gradle.kts` bie prapa te çelësi i debug-ut dhe
          # prodhon një AAB që Play-i e refuzon. Te PR-të nga fork-et sekretet
          # janë bosh me qëllim të GitHub-it, ndaj ai ndërtim rri i panënshkruar
          # — i mjaftueshëm si kontroll, kurrë si lëshim.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Pa ANDROID_KEYSTORE_BASE64 — ndërtim me çelësin e debug-ut."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=$(pwd)/app/release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Ndërto AAB-në
        working-directory: tokerrgjik_mobile
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Ndërto APK-në
        working-directory: tokerrgjik_mobile
        run: flutter build apk --release

      - name: Kontrollo se AAB-ja NUK është nënshkruar me çelësin e debug-ut
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          # Një AAB i nënshkruar me debug ngarkohet, duket i rregullt dhe
          # refuzohet vetëm nga Play Console — pasi ke pritur ndërtimin.
          AAB=tokerrgjik_mobile/build/app/outputs/bundle/release/app-release.aab
          if keytool -printcert -jarfile "$AAB" | grep -q 'CN=Android Debug'; then
            echo "::error::AAB-ja u nënshkrua me çelësin e DEBUG-ut."
            exit 1
          fi
          keytool -printcert -jarfile "$AAB" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            tokerrgjik_mobile/build/app/outputs/bundle/release/app-release.aab
            tokerrgjik_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ── Web ───────────────────────────────────────────────────────────────────
  #
  # I njëjti kod si aplikacioni, i shërbyer nga i njëjti server si API-ja.
  web:
    name: Web
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: tokerrgjik_mobile
        run: |
          flutter pub get
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: tokerrgjik_mobile/build/web
          if-no-files-found: error

  # ── Lëshimi ───────────────────────────────────────────────────────────────
  release:
    name: Lëshimi
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, web ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
