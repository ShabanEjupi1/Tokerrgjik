name: tokerrgjik_mobile
description: Tokërrgjik — loja tradicionale shqiptare e strategjisë.
publish_to: 'none'

# 2.0.0: rishkrim i plotë. Numri i ndërtimit duhet të rritet në ÇDO ngarkim te
# Play, edhe kur versioni i dukshëm nuk ndryshon.
version: 2.0.0+20

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔑 Rregullat dhe kompjuteri. I njëjti kod që ekzekuton serveri.
  tokerrgjik_engine:
    path: ../engine

  # Gjithçka tjetër është hequr me qëllim. Aplikacioni i vjetër varej nga 26
  # paketa — reklama, Stripe, Sentry, sqflite, socket.io, zgjedhës ngjyrash,
  # konfeti — për një lojë tabele që luhet me gishtin mbi 24 pika. Secila prej
  # tyre ishte një ndërtim që mund të prishej, një leje që Play-i e pyeste, dhe
  # një arsye pse APK-ja ishte 40 MB.
  http: ^1.2.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
