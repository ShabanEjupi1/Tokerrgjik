server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Flutter entry points are rewritten by every build but keep the same
    # filenames, so a caching CDN in front of us (Cloudflare) will happily serve
    # a stale app for hours after a deploy - which silently pins players to the
    # old backend. These must never be cached; the hashed assets below can be.
    location ~ ^/(index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Content-hashed by the build, so safe to cache hard.
    location ~ ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Netlify-functions-style API, served by the adapter container
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # socket.io — websocket upgrade to the multiplayer server
    location /socket.io/ {
        proxy_pass         http://socket:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
