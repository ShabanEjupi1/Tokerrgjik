name: tokerrgjik

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    container_name: tokerrgjik-web
    restart: unless-stopped
    depends_on:
      - api
      - socket
    ports:
      - "127.0.0.1:8105:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    container_name: tokerrgjik-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SMTP_HOST: ${SMTP_HOST:-mail.spacecode.tech}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}

  socket:
    build:
      context: ..
      dockerfile: deploy/socket/Dockerfile
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://tokerrgjik.shabanejupi.tech}
    container_name: tokerrgjik-socket
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}

  db:
    image: postgres:17-alpine
    container_name: tokerrgjik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tokerrgjik}
      POSTGRES_USER: ${POSTGRES_USER:-tokerrgjik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokerrgjik} -d ${POSTGRES_DB:-tokerrgjik}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
